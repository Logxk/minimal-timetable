<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 图标底板 (圆角矩形) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="4"/>

  <!-- 课表内嵌面板 -->
  <g filter="url(#shadow)">
    <rect x="64" y="64" width="384" height="384" rx="36" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>
  </g>

  <!-- 顶部星期指示圆点 / 栏 -->
  <circle cx="120" cy="116" r="10" fill="#94a3b8"/>
  <circle cx="190" cy="116" r="10" fill="#94a3b8"/>
  <circle cx="260" cy="116" r="10" fill="#3b82f6"/> <!-- 今天 -->
  <circle cx="330" cy="116" r="10" fill="#94a3b8"/>
  <circle cx="400" cy="116" r="10" fill="#94a3b8"/>

  <!-- 横向时间虚线 -->
  <line x1="88" y1="160" x2="424" y2="160" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="88" y1="240" x2="424" y2="240" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="88" y1="320" x2="424" y2="320" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="88" y1="400" x2="424" y2="400" stroke="#f1f5f9" stroke-width="2"/>

  <!-- 纵向周线 -->
  <line x1="155" y1="140" x2="155" y2="416" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="225" y1="140" x2="225" y2="416" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="295" y1="140" x2="295" y2="416" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="365" y1="140" x2="365" y2="416" stroke="#f1f5f9" stroke-width="2"/>

  <!-- 课程卡片 1 (蓝色连堂) -->
  <rect x="94" y="170" width="52" height="136" rx="10" fill="url(#cardGrad1)"/>
  
  <!-- 课程卡片 2 (绿色) -->
  <rect x="234" y="250" width="52" height="66" rx="10" fill="url(#cardGrad2)"/>

  <!-- 课程卡片 3 (琥珀橙色) -->
  <rect x="304" y="170" width="52" height="66" rx="10" fill="url(#cardGrad3)"/>

  <!-- 课程卡片 4 (紫粉色) -->
  <rect x="374" y="250" width="52" height="136" rx="10" fill="#8b5cf6"/>
</svg>
